<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pestaña de contacto de la web dedicada a la promoción de mi instituto IES el Caminás"
    />
    <title>Contacto IES Caminás</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Contacto IES Caminás">
    <meta property="og:image" content="resources/Logo_texto.png">
    <meta property="og:description" content="Pestaña de contacto de la web dedicada a la promoción de mi instituto IES el Caminás">
    <link rel="icon" type="image/jpg" href="resources/Logo.jpg">
    <link rel="stylesheet" href="estilos.css" />
  </head>

  <body>

    <header class="hero">
        <h1>IES El Caminás</h1>
    </header>
    
    <main>
        <form action="PaginaFictia.es" method="post">
        
            <fieldset>
                <legend>Inserte sus datos personales</legend>

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                
                <p></p>

                <label for="selector_curso">Seleccione su curso</label>
                <select name="selector_curso" id="selector_curso">
                    <optgroup label="ESO">
                        <option value="1_ESO">1º ESO</option>
                        <option value="2_ESO">2º ESO</option>
                        <option value="3_ESO">3º ESO</option>
                        <option value="4_ESO">4º ESO</option>
                    </optgroup>
                    <optgroup label="Bachillerato">
                        <option value="1_BACA">1º BACA</option>
                        <option value="2_BACA">2º BACA</option>
                        <option value="1_BAHA">1º BAHA</option>
                        <option value="2_BAHA">2º BAHA</option>
                    </optgroup>
                </select>

                <label  for="telefono">Teléfono de contacto</label>
                <input type="tel" maxlength="9" pattern="[0-9]{9}" inputmode="numeric" id="telefono" name="telefono">

                <p></p>
                
                <label class="politica_privacidad" for="politica_privacidad">Marque la casilla para aceptar nuestras politicas de privacidad</label>
                <input type="checkbox" id="politica_privacidad" name="politica_privacidad" value="1" required>

                <p></p>

                <button type="submit">Enviar solicitud</button>
            </fieldset>

        </form>
    </main>

    <footer>
        <h2>Otras secciones de nuestra web que te pueden interesar</h2>
        <nav>
            <ul>
                <li><a href="index.html">Nuestra pestaña de inicio</a></li>
                <li><a href="estudios.html">Nuestra Oferta Educativa</a></li>
            </ul>
        </nav>
    </footer>

  </body>
</html>
